s="locations-back" href="../zh/locations/">← 返回地点目录</a><span class="locations-eyebrow">地点介绍</span><h1>电力线塔</h1><p class="locations-lead">可通过电线滑行的高处通行点。</p><div class="locations-sections"><section class="locations-section"><h2>特殊玩法</h2><p>攀上塔的平台搜查箱子与油桶，再沿连接塔间的电线移动。</p></section><section class="locations-section"><h2>主要收益</h2><p>平台容器提供物资；滑索可跨越森林和山丘。</p></section><section class="locations-section"><h2>风险</h2><p>滑行时暴露在空中，地面玩家容易看到；这不是可建造的瞭望塔。</p></section><section class="locations-section"><h2>回收机</h2><p>需要回收物资时，可去加油站、停车场、城镇、仓库、伐木工人或矿工。</p></section></div></article></main><footer class="site-footer"><span>氧化物生存岛爱好者论坛</span><span>氧化物生存岛爱好者论坛</span></footer></body></html>
