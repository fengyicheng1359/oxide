="locations-eyebrow">地点介绍</span><h1>陨石钻机点</h1><p class="locations-lead">围绕钻机与三组拉杆展开的资源地点。</p><div class="locations-sections"><section class="locations-section"><h2>特殊玩法</h2><p>在三个房间启动拉杆，相邻启动间隔不能超过 10 秒；故障时看灯光提示，并在 30 秒内修复。</p></section><section class="locations-section"><h2>主要收益</h2><p>钻机成功运转 3 分钟，产出高品质金属和石头，随后冷却 15 分钟；附近还有资源商人。</p></section><section class="locations-section"><h2>风险</h2><p>操作期间需反复移动并停留，注意其他玩家和地点内的异常危险。</p></section><section class="locations-section"><h2>回收机</h2><p>需要回收物资时，可去加油站、停车场、城镇、仓库、伐木工人或矿工。</p></section></div></article></main><footer class="site-footer"><span>氧化物生存岛爱好者论坛</span><span>氧化物生存岛爱好者论坛</span></footer></body></html>
