lass="gameplay-sidebar-foot">共 47 篇玩法<br/>按主题重新整理</div></aside><section class="gameplay-article-main"><nav aria-label="面包屑" class="gameplay-breadcrumb"><a href="../index.html">首页</a><span>/</span><a href="./index.html">玩法攻略</a><span>/</span><span>建造与基地</span></nav><article class="gameplay-article"><span class="eyebrow">建造与基地</span><h1>密码锁如何工作？输入错误的密码会发生什么？</h1><div class="gameplay-body"><p>你可以在门和储物容器上安装密码锁，用数字密码来保护它们。</p>
<ul>
<li>系统会对失败的尝试进行惩罚——每输入一次错误的密码都会产生后果，因此你无法通过穷举所有组合来“撞大运”。</li>
<li>请设置一个你能记住的密码，并仅与可信赖的队友共享。</li>
</ul><a class="article-source" href="https://support.playoxide.com/hc/zh-Hans/oxide/articles/-122" rel="noopener" target="_blank">官方原文 ↗</a></div><a class="gameplay-back" href="./index.html">← 返回玩法攻略</a></article></section></div></main><footer class="site-footer"><span>氧化物生存岛爱好者论坛</span><span>氧化物生存岛爱好者论坛</span></footer></body></html>
